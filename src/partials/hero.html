  <!-- ═══════════════════════════════════════════════════════

       - Capa 1: Atmósfera Base / Gradientes & Líneas (z-index: 1)
       - Capa 2: Elementos Dinámicos en Sandwich (Rango z-index: 10 a 19):
           * z-index: 11 -> Geometrías 3D de Fondo (Canvas Back)
           * z-index: 12 -> Contenedor Bento Frames (Componentes Modulares)
           * z-index: 14 -> Geometrías 3D Frontales (Canvas Front)
           * z-index: 15-16 -> Doodles Vectoriales
       - Capa 3: Overlay de Contraste Tipográfico (z-index: 20)
       - Capa 4: Contenido UI & Tipografía (z-index: 21)

  <div id="hero-scroll-container" class="hero-scroll-container">
    <section id="hero" aria-label="Presentación">

      <!-- ── CAPA 0: VIDEO AMBIENT (z-index: 0) ── -->
      <div id="hero-layer-video" class="hero__layer-video" aria-hidden="true"></div>

        <canvas id="three-canvas-back" class="hero__canvas-back" aria-hidden="true"></canvas>
