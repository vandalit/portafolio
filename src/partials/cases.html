  <!-- ═══════════════════════════════════════════════════════
       CASOS DE ESTUDIO
  ══════════════════════════════════════════════════════════ -->
  <section id="cases" aria-label="Casos de estudio">
    <div class="container">
      <header class="section-header reveal">
        <p id="cases-eyebrow" class="eyebrow section-header__eyebrow">Proyectos seleccionados</p>
        <h2 id="cases-title" class="section-header__title display">Casos de Estudio</h2>
        <p id="cases-desc" class="section-header__desc">
          Proyectos donde el brief fue el punto de partida, no el límite.
        </p>
      </header>

      <!-- Featured (Destacado) -->
      <div id="featured-case" class="featured-case reveal" role="button" tabindex="0" aria-label="Ver caso destacado">
        <!-- Populated by JS -->
      </div>

      <!-- Carousel -->
      <div id="cases-carousel" class="carousel-wrapper reveal" aria-label="Carrusel de casos de estudio">
        <div class="carousel-track-container">
          <div class="carousel-track" role="list">
            <!-- Cards populated by JS -->
          </div>
        </div>
        <div class="carousel-controls">
          <div class="carousel-progress">
            <div class="carousel-progress__fill" style="width: 0%"></div>
          </div>
          <button class="carousel-btn" data-carousel-prev aria-label="Anterior">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
              <path d="M10 3L5 8L10 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
            </svg>
          </button>
          <button class="carousel-btn" data-carousel-next aria-label="Siguiente">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
              <path d="M6 3L11 8L6 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
            </svg>
          </button>
        </div>
      </div>
    </div>
  </section>
