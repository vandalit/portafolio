  <section id="cases" aria-label="Casos de estudio v1">
    <div class="container">
      <header class="section-header reveal">
        <p id="cases-eyebrow" class="eyebrow section-header__eyebrow">Proyectos seleccionados · <span style="color: var(--magenta, #d4205a); font-weight: 600;">[v1 LEGACY]</span></p>
        <h2 id="cases-title" class="section-header__title display">Casos de Estudio <small style="font-size: 0.4em; opacity: 0.6; vertical-align: middle;">(v1)</small></h2>

          Proyectos donde el brief fue el punto de partida, no el límite.
        </p>
      </header>

      <div id="featured-case" class="featured-case reveal" role="button" tabindex="0" aria-label="Ver caso destacado">

        </div>
      </div>
    </div>
