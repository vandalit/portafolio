  <section id="cases-v4" class="cases-v4" aria-label="Casos de estudio v4">
    <div class="container">
      <header class="section-header reveal">
        <p id="cases-eyebrow" class="eyebrow section-header__eyebrow">Proyectos seleccionados</p>
        <h2 id="cases-title" class="section-header__title display">Casos de Estudio</h2>
        <p id="cases-desc" class="section-header__desc">Proyectos donde el brief fue el punto de partida, no el límite.</p>
      </header>

      <div class="cv4-board">
        <div class="cv4-board__art" aria-hidden="true">
          <img class="cv4-board__image" data-cv4-backdrop-layer="active" alt="">
          <img class="cv4-board__image cv4-board__image--incoming" data-cv4-backdrop-layer="incoming" alt="">
        </div>

        <article class="cv4-featured" aria-label="Caso destacado">
          <div class="cv4-featured__art" aria-hidden="true">
            <img class="cv4-featured__image" data-featured-layer="active" alt="">
            <img class="cv4-featured__image cv4-featured__image--incoming" data-featured-layer="incoming" alt="">
          </div>
          <p class="cv4-featured__label">Imagen destacada</p>
          <div class="cv4-featured__content">
            <p class="cv4-featured__eyebrow"></p>
            <h3 class="cv4-featured__title"></h3>
            <p class="cv4-featured__description"></p>
            <div class="cv4-featured__meta">
              <button class="cv4-featured__cta btn btn--primary" type="button">
                Ver caso <span aria-hidden="true">→</span>
              </button>
              <span class="cv4-featured__tag" data-cv4-featured-year></span>
              <span class="cv4-featured__tag" data-cv4-featured-role></span>
            </div>
          </div>
        </article>

        <div class="cv4-carousel-row">
          <div class="cv4-carousel cv4-carousel--compact" data-cv4-carousel="compact">
            <div class="cv4-carousel__viewport" tabindex="0" role="region" aria-label="Carrusel compacto de casos">
              <div class="cv4-carousel__track" role="group" aria-label="Casos de estudio"></div>
            </div>
          </div>

          <div class="cv4-divider" aria-hidden="true">
            <span class="cv4-divider__bar cv4-divider__bar--left"></span>
            <span class="cv4-divider__bar cv4-divider__bar--main"></span>
            <span class="cv4-divider__bar cv4-divider__bar--right"></span>
            <svg class="cv4-divider__triangle" viewBox="0 0 40 40" focusable="false">
              <path d="M17.3 3.8a3.1 3.1 0 0 1 5.4 0l14.2 24.7a5.3 5.3 0 0 1-4.6 8H7.7a5.3 5.3 0 0 1-4.6-8L17.3 3.8Z"/>
            </svg>
          </div>

          <div class="cv4-carousel cv4-carousel--wide" data-cv4-carousel="wide">
            <div class="cv4-carousel__viewport" tabindex="0" role="region" aria-label="Carrusel de serie de casos">
              <div class="cv4-carousel__track" role="group" aria-label="Casos de estudio"></div>
            </div>
            <div class="cv4-carousel__controls" aria-label="Controles del carrusel">
              <span class="cv4-item-counter" aria-label="Número del item activo">
                <span>Item</span>
                <output data-cv4-item-number aria-live="off">01</output>
              </span>
              <div class="cv4-carousel__navigation" aria-label="Navegación del carrusel">
                <button class="cv4-carousel__button" type="button" data-cv4-step="-1" aria-label="Elemento anterior">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
                </button>
                <button class="cv4-carousel__button" type="button" data-cv4-step="1" aria-label="Elemento siguiente">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="cv4-station__runway" aria-hidden="true"></div>
    </div>
  </section>
